name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Force SDK 35 and Fix AndroidX Core
        run: |
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/g' android/variables.gradle
          sed -i 's/targetSdkVersion = 34/targetSdkVersion = 35/g' android/variables.gradle
          sed -i 's/androidxCoreVersion = .*/androidxCoreVersion = '"'"'1.13.1'"'"'/g' android/variables.gradle
          sed -i 's/rootProject.ext.compileSdkVersion : 34/rootProject.ext.compileSdkVersion : 35/g' android/capacitor-cordova-android-plugins/build.gradle || true
          sed -i 's/rootProject.ext.targetSdkVersion : 34/rootProject.ext.targetSdkVersion : 35/g' android/capacitor-cordova-android-plugins/build.gradle || true

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
